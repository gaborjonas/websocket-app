name: CI Server

on:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, uuid
          coverage: xdebug
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: server/vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer -d server install --prefer-dist --no-interaction --no-progress

      - name: Coding Standards
        run: composer -d server lint:check

      - name: Static Analysis
        run: composer -d server stan

      - name: Unit Tests
        run: composer -d server test