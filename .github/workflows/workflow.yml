name: CI Checks

on:
  push:

jobs:
  web:
    name: Front-end checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web

      - name: Lint
        run: npm run lint --prefix web

      - name: Type Check
        run: npm run type-check --prefix web

      - name: Unit Tests
        run: npm run test:run --prefix web

      - name: Build
        run: npm run build-only --prefix web

  server:
    name: Back-end checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, uuid
          coverage: xdebug
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: server/vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer -d server install --prefer-dist --no-interaction --no-progress

      - name: Coding Standards
        run: composer -d server lint:check

      - name: Static Analysis
        run: composer -d server stan

      - name: Unit Tests
        run: composer -d server test
